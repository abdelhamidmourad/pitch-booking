<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم الملعب</title>
<style>
:root{--bg:#f4f6f5;--fg:#1b2b22;--card:#fff;--ac:#1f8a4c;--bd:#dde5e0;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#121a15;--fg:#e8f0ea;--card:#1b261f;--bd:#2c3b31}}
body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--fg)}
header{background:var(--ac);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1000px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:center}
.stats b{display:block;font-size:26px;color:var(--ac)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}
input,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.d{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.err{color:var(--bad)}.wrap{overflow-x:auto}
</style></head><body>
<header><b>لوحة تحكم حجز الملعب</b><button id="out" hidden>خروج</button></header>
<main>
<div id="login" class="card" style="max-width:360px;margin:60px auto"><h3>تسجيل دخول الإدارة</h3>
<div class="row"><input id="em" placeholder="البريد الإلكتروني" style="flex:1"></div>
<div class="row"><input id="pw" type="password" placeholder="كلمة المرور" style="flex:1"></div>
<button id="go">دخول</button> <span id="lerr" class="err"></span></div>
<div id="app" hidden>
<div class="stats" id="stats"></div><br>
<div class="card"><h3>الحجوزات</h3><div class="row"><input id="fd" type="date"><button id="fb">تصفية</button><button id="fa">الكل</button></div>
<div class="wrap"><table><thead><tr><th>#</th><th>العميل</th><th>الهاتف</th><th>الملعب</th><th>التاريخ</th><th>الساعة</th><th>الحالة</th><th></th></tr></thead><tbody id="bk"></tbody></table></div></div>
<div class="card"><h3>الملاعب</h3>
<div class="row"><input id="pn" placeholder="اسم الملعب"><input id="pp" type="number" placeholder="السعر" style="width:90px"><input id="po" type="number" value="16" style="width:70px" title="ساعة الفتح"><input id="pc" type="number" value="24" style="width:70px" title="ساعة الإغلاق"><button id="pa">إضافة</button></div>
<div class="wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>السعر</th><th>من</th><th>إلى</th><th>الحالة</th><th></th></tr></thead><tbody id="pt"></tbody></table></div>
<span id="perr" class="err"></span></div>
<div class="card"><h3>المستخدمون</h3><div class="wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الدور</th><th>حجوزات</th></tr></thead><tbody id="ut"></tbody></table></div></div>
</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=null;try{token=localStorage.getItem('t')}catch{}
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)logout();throw new Error(d.error||'خطأ')}return d}
function logout(){token=null;try{localStorage.removeItem('t')}catch{}$('#app').hidden=true;$('#out').hidden=true;$('#login').hidden=false}
async function load(date){
 const s=await api('GET','/api/admin/stats');
 $('#stats').innerHTML=[['إجمالي الحجوزات',s.total_bookings],['حجوزات اليوم',s.today_bookings],['الإيراد (جنيه)',s.revenue],['المستخدمون',s.users]].map(([l,v])=>`<div><b>${esc(v)}</b>${l}</div>`).join('');
 const bs=await api('GET','/api/admin/bookings'+(date?'?date='+date:''));
 $('#bk').innerHTML=bs.map(b=>`<tr><td>${b.id}</td><td>${esc(b.user_name)}</td><td>${esc(b.user_phone)}</td><td>${esc(b.pitch_name)}</td><td>${esc(b.date)}</td><td>${b.hour}:00</td><td>${b.status==='confirmed'?'مؤكد':'ملغي'}</td><td>${b.status==='confirmed'?`<button class="d" data-c="${b.id}">إلغاء</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">لا توجد حجوزات</td></tr>';
 const ps=await api('GET','/api/admin/pitches');
 $('#pt').innerHTML=ps.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.price}</td><td>${p.open_hour}</td><td>${p.close_hour}</td><td>${p.active?'مفعّل':'موقوف'}</td><td><button data-t="${p.id}" data-a="${p.active?0:1}">${p.active?'إيقاف':'تفعيل'}</button> <button data-e="${p.id}" data-n="${esc(p.name)}" data-p="${p.price}">تعديل</button></td></tr>`).join('');
 const us=await api('GET','/api/admin/users');
 $('#ut').innerHTML=us.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role==='admin'?'إدارة':'عميل'}</td><td>${u.bookings}</td></tr>`).join('')}
async function enter(){$('#login').hidden=true;$('#app').hidden=false;$('#out').hidden=false;try{await load()}catch(e){alert(e.message)}}
$('#go').onclick=async()=>{$('#lerr').textContent='';try{const d=await api('POST','/api/login',{email:$('#em').value,password:$('#pw').value});
 if(d.user.role!=='admin')throw new Error('هذا الحساب ليس حساب إدارة');token=d.token;try{localStorage.setItem('t',token)}catch{}enter()}catch(e){$('#lerr').textContent=e.message}};
$('#out').onclick=logout;
$('#fb').onclick=()=>load($('#fd').value);$('#fa').onclick=()=>{$('#fd').value='';load()};
$('#bk').onclick=async e=>{const id=e.target.dataset.c;if(id&&confirm('إلغاء الحجز؟')){await api('DELETE','/api/bookings/'+id);load($('#fd').value)}};
$('#pt').onclick=async e=>{const d=e.target.dataset;$('#perr').textContent='';try{
 if(d.t){await api('PUT','/api/admin/pitches/'+d.t,{active:d.a==='1'})}
 else if(d.e){const n=prompt('اسم الملعب',d.n);if(n===null)return;const pr=prompt('السعر (جنيه/ساعة)',d.p);if(pr===null)return;await api('PUT','/api/admin/pitches/'+d.e,{name:n,price:+pr})}
 else return;load($('#fd').value)}catch(x){$('#perr').textContent=x.message}};
$('#pa').onclick=async()=>{$('#perr').textContent='';try{await api('POST','/api/admin/pitches',{name:$('#pn').value,price:+$('#pp').value,open_hour:+$('#po').value,close_hour:+$('#pc').value});$('#pn').value='';load($('#fd').value)}catch(e){$('#perr').textContent=e.message}};
if(token)enter();
</script></body></html>
